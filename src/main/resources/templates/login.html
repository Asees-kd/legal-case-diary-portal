<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chamber Access &bull; Legal Case Diary Portal</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="login-body">

<div class="login-card">
    <div class="login-brand-header">
        <!-- Inline Scales of Justice SVG Emblem -->
        <svg class="brand-svg-icon" style="width: 44px; height: 44px; margin: 0 auto; display: block;" viewBox="0 0 24 24" fill="#B08D3C">
            <path d="M12 2C11.45 2 11 2.45 11 3V4.08C7.59 4.56 5 7.47 5 11V13H3V15H5V19C5 20.1 5.9 21 7 21H17C18.1 21 19 20.1 19 19V15H21V13H19V11C19 7.47 16.41 4.56 13 4.08V3C13 2.45 12.55 2 12 2ZM7 11C7 8.24 9.24 6 12 6C14.76 6 17 8.24 17 11V13H7V11ZM7 15H17V19H7V15Z"/>
        </svg>
        <h1 class="serif-heading">Legal Case Diary Portal</h1>
        <p>Senior Chamber &amp; Litigation Registry</p>
    </div>

    <!-- Error Alert -->
    <div th:if="${errorMessage}" class="alert alert-danger" role="alert">
        <span th:text="${errorMessage}">Invalid credentials.</span>
    </div>

    <!-- Logout Alert -->
    <div th:if="${logoutMessage}" class="alert alert-success" role="alert">
        <span th:text="${logoutMessage}">Chamber session closed.</span>
    </div>

    <!-- Login Form -->
    <form th:action="@{/login}" method="post">
        <!-- CSRF Token -->
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <div class="form-group">
            <label for="username" class="form-label">Docket Username</label>
            <input type="text" id="username" name="username" class="form-control" placeholder="e.g. clerk, lawyer, admin" required autofocus autocomplete="username">
        </div>

        <div class="form-group">
            <label for="password" class="form-label">Chamber Passcode</label>
            <input type="password" id="password" name="password" class="form-control" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;" required autocomplete="current-password">
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; margin-top: 8px;">
            <svg style="width: 16px; height: 16px; fill: currentColor;" viewBox="0 0 24 24">
                <path d="M10 17V14H3V10H10V7L15 12L10 17ZM19 3H5C3.9 3 3 3.9 3 5V8H5V5H19V19H5V16H3V19C3 20.1 3.9 21 5 21H19C20.1 21 21 20.1 21 19V5C21 3.9 20.1 3 19 3Z"/>
            </svg>
            Sign In to Chambers
        </button>
    </form>

    <!-- Role Authentication Matrix Reference -->
    <div class="login-credentials-hint">
        <strong>Authorized Chamber Roles:</strong>
        <div style="margin-top: 6px; display: grid; gap: 4px;">
            <div>&bull; <strong>Clerk:</strong> <code>clerk</code> / <code>clerk123</code> (Filing &amp; Registry)</div>
            <div>&bull; <strong>Lawyer:</strong> <code>lawyer</code> / <code>lawyer123</code> (Review &amp; Hearing Schedule)</div>
            <div>&bull; <strong>Admin:</strong> <code>admin</code> / <code>admin123</code> (Managing Partner &amp; Closure)</div>
        </div>
    </div>
</div>

</body>
</html>
