<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en">
<head th:replace="~{fragments/layout :: head('Edit ' + ${legalCase.caseNumber})}"></head>
<body>

<div class="app-layout">
    <!-- Left Sidebar -->
    <div th:replace="~{fragments/layout :: sidebar(${activeNav})}"></div>

    <!-- Main Content -->
    <main class="main-content">
        <header th:replace="~{fragments/layout :: header('Edit Case Dossier', 'Amend Case Metadata and Hearing Notes')}"></header>

        <!-- Flash Alerts -->
        <div th:replace="~{fragments/layout :: alerts}"></div>

        <div style="max-width: 850px;">
            <div class="card">
                <div class="card-header" style="border-bottom: 1px solid var(--border-color); padding-bottom: 14px; margin-bottom: 20px;">
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <div>
                            <h2 class="serif-heading" style="font-size: 1.25rem; margin: 0;">Case Modification: <span th:text="${legalCase.caseNumber}">CC/001</span></h2>
                            <p style="font-size: 0.85rem; color: var(--text-muted); margin: 4px 0 0 0;">
                                Case Number and Filing Date remain immutable judicial records.
                            </p>
                        </div>
                        <a th:href="@{/cases/{id}(id=${legalCase.id})}" class="btn btn-outline" style="font-size: 0.82rem;">
                            &larr; Back to Dossier
                        </a>
                    </div>
                </div>

                <form th:action="@{/cases/{id}/edit(id=${legalCase.id})}" th:object="${legalCase}" method="post">
                    <!-- CSRF Token -->
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <input type="hidden" th:field="*{id}"/>
                    <input type="hidden" th:field="*{caseNumber}"/>
                    <input type="hidden" th:field="*{filedDate}"/>

                    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 18px;">
                        <!-- Case Category -->
                        <div class="form-group">
                            <label for="caseType" class="form-label">Jurisdictional Category *</label>
                            <select id="caseType" th:field="*{caseType}" class="form-control" required>
                                <option th:each="type : ${caseTypes}" th:value="${type}" th:text="${type.displayName}">Civil</option>
                            </select>
                            <div th:if="${#fields.hasErrors('caseType')}" class="form-error" th:errors="*{caseType}">Category error</div>
                        </div>

                        <!-- Court Name -->
                        <div class="form-group">
                            <label for="courtName" class="form-label">Court / Judicial Forum *</label>
                            <input type="text" id="courtName" th:field="*{courtName}" class="form-control" required>
                            <div th:if="${#fields.hasErrors('courtName')}" class="form-error" th:errors="*{courtName}">Court name error</div>
                        </div>

                        <!-- Title -->
                        <div class="form-group" style="grid-column: 1 / -1;">
                            <label for="title" class="form-label">Case Caption / Cause Title *</label>
                            <input type="text" id="title" th:field="*{title}" class="form-control" required>
                            <div th:if="${#fields.hasErrors('title')}" class="form-error" th:errors="*{title}">Title error</div>
                        </div>

                        <!-- Petitioner -->
                        <div class="form-group">
                            <label for="petitionerName" class="form-label">Petitioner / Appellant *</label>
                            <input type="text" id="petitionerName" th:field="*{petitionerName}" class="form-control" required>
                            <div th:if="${#fields.hasErrors('petitionerName')}" class="form-error" th:errors="*{petitionerName}">Petitioner error</div>
                        </div>

                        <!-- Respondent -->
                        <div class="form-group">
                            <label for="respondentName" class="form-label">Respondent / Defendant *</label>
                            <input type="text" id="respondentName" th:field="*{respondentName}" class="form-control" required>
                            <div th:if="${#fields.hasErrors('respondentName')}" class="form-error" th:errors="*{respondentName}">Respondent error</div>
                        </div>

                        <!-- Hearing Date -->
                        <div class="form-group">
                            <label for="hearingDate" class="form-label">Scheduled Hearing Date</label>
                            <input type="date" id="hearingDate" th:field="*{hearingDate}" class="form-control">
                        </div>

                        <!-- Hearing Notes -->
                        <div class="form-group" style="grid-column: 1 / -1;">
                            <label for="hearingNotes" class="form-label">Bench Notes &amp; Legal Directives</label>
                            <textarea id="hearingNotes" th:field="*{hearingNotes}" rows="3" class="form-control" placeholder="Directives from the bench..."></textarea>
                        </div>
                    </div>

                    <div style="margin-top: 24px; padding-top: 18px; border-top: 1px solid var(--border-color); display: flex; justify-content: flex-end; gap: 12px;">
                        <a th:href="@{/cases/{id}(id=${legalCase.id})}" class="btn btn-outline">Cancel</a>
                        <button type="submit" class="btn btn-primary">
                            Save Docket Changes
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </main>
</div>

</body>
</html>
