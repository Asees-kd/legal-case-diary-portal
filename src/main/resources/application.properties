spring.application.name=legal-diary

# Server Configuration (Port 8081 for Local Dev Server)
server.port=8081
server.servlet.context-path=/

# H2 Persistent File-Mode Database Configuration (Configurable via H2_DB_PATH, defaults to user.home/.legal-diary/data/casediary)
h2.db.path=${H2_DB_PATH:${user.home}/.legal-diary/data/casediary}
spring.datasource.url=jdbc:h2:file:${h2.db.path};DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Spring Data JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (Developer Inspection)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
