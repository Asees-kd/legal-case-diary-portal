---
- name: Deploy and Configure Legal Case Diary Portal
  hosts: app_servers
  become: yes
  vars:
    app_version: "1.0.0"
    app_user: legaldiary
    app_group: legaldiary
    base_dir: /opt/legal-diary
    server_port: 8083
    war_src: "{{ playbook_dir }}/../target/legal-diary.war"

  tasks:
    - name: Install OpenJDK 17 JRE Headless
      ansible.builtin.apt:
        name: openjdk-17-jre-headless
        state: present
        update_cache: yes
        cache_valid_time: 3600

    - name: Create legaldiary system group
      ansible.builtin.group:
        name: "{{ app_group }}"
        system: yes
        state: present

    - name: Create legaldiary system user
      ansible.builtin.user:
        name: "{{ app_user }}"
        group: "{{ app_group }}"
        system: yes
        shell: /usr/sbin/nologin
        home: "{{ base_dir }}"
        create_home: no
        state: present

    - name: Ensure application directory structure exists
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_group }}"
        mode: '0755'
      loop:
        - "{{ base_dir }}"
        - "{{ base_dir }}/releases"
        - "{{ base_dir }}/releases/{{ app_version }}"
        - "{{ base_dir }}/shared"

    - name: Deploy application WAR archive
      ansible.builtin.copy:
        src: "{{ war_src }}"
        dest: "{{ base_dir }}/releases/{{ app_version }}/legal-diary.war"
        owner: "{{ app_user }}"
        group: "{{ app_group }}"
        mode: '0755'
      notify: restart legal-diary

    - name: Point current symlink to target release
      ansible.builtin.file:
        src: "{{ base_dir }}/releases/{{ app_version }}"
        dest: "{{ base_dir }}/current"
        state: link
        owner: "{{ app_user }}"
        group: "{{ app_group }}"
        force: yes
      notify: restart legal-diary

    - name: Install systemd unit service file
      ansible.builtin.copy:
        dest: /etc/systemd/system/legal-diary.service
        content: |
          [Unit]
          Description=Legal Case Diary Portal Spring Boot Application
          After=network.target

          [Service]
          Type=simple
          User={{ app_user }}
          Group={{ app_group }}
          WorkingDirectory={{ base_dir }}
          Environment="SERVER_PORT={{ server_port }}"
          Environment="H2_DB_PATH={{ base_dir }}/shared/casediary"
          ExecStart=/usr/bin/java -jar {{ base_dir }}/current/legal-diary.war
          SuccessExitStatus=143
          Restart=always
          RestartSec=5

          [Install]
          WantedBy=multi-user.target
        owner: root
        group: root
        mode: '0644'
      notify: restart legal-diary

    - name: Ensure legal-diary service is enabled and started
      ansible.builtin.systemd:
        name: legal-diary
        state: started
        enabled: yes
        daemon_reload: yes

    - name: Flush handlers to apply service restarts immediately
      ansible.builtin.meta: flush_handlers

    - name: Verify application endpoint is healthy
      ansible.builtin.uri:
        url: "http://localhost:{{ server_port }}/login"
        status_code: 200
      register: health_check
      until: health_check.status == 200
      retries: 20
      delay: 5
      changed_when: false

  handlers:
    - name: restart legal-diary
      ansible.builtin.systemd:
        name: legal-diary
        state: restarted
        daemon_reload: yes
